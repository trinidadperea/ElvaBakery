<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elva Bakery | Creá tu torta</title>

    <link rel="stylesheet" href="static/css/global.css">
    <link rel="stylesheet" href="static/css/crear-torta.css">
</head>

<body>

    <main class="crear-torta-page">

        <!-- VOLVER -->
        <a href="personalizadas.html" class="back-button">
            ← Volver
        </a>


        <!-- HEADER -->
        <header class="crear-torta-header">

            <h1>Creá tu torta</h1>

            <p>
                Elegí el tipo de torta que querés personalizar
            </p>

        </header>


        <!-- OPCIONES -->
        <section class="crear-torta-options">

            <!-- LETTER / NUMBER CAKE -->

            <a href="letter-number.html" class="crear-torta-option">

                <div class="option-content">

                    <h2>Letter / Number Cake</h2>

                    <p>
                        Elegí una letra o número y personalizá tu torta.
                    </p>

                </div>

                <span class="arrow">→</span>

            </a>


            <!-- BIZCOCHUELO -->

            <a href="torta-bizcochuelo.html" class="crear-torta-option">

                <div class="option-content">

                    <h2>Personalizada de bizcochuelo</h2>

                    <p>
                        Armá tu torta eligiendo el tamaño,
                        los rellenos y cada detalle.
                    </p>

                </div>

                <span class="arrow">→</span>

            </a>

        </section>

    </main>

    <script src="static/js/footer.js"></script>
