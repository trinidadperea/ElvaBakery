
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elva Bakery | Tortas</title>

    <link rel="stylesheet" href="static/css/global.css">
    <link rel="stylesheet" href="static/css/tortas.css">
</head>

<body>

    <main class="tortas-page">

        <header class="tortas-header">

            <a href="personalizadas.html" class="back-button">
                ← Volver
            </a>

            <h1>Tortas</h1>

            <p>
                Algunas de las elegidas por ustedes!!
            </p>

        </header>


        <!-- =========================
             CARRUSEL DE TORTAS
        ========================== -->

        <section class="tortas-carousel">

            <button class="carousel-button carousel-prev" id="prevTorta">
                ‹
            </button>

            <div class="carousel-slide">

                <div class="carousel-image">
                    <img id="carouselImagen"
                        src="static/img/personalizadas/letraE.jpeg"
                        alt="Letter Cake - Letra E">
                </div>

                <div class="carousel-info">

                    <h2 id="carouselTitulo">
                        Letter Cake - Letra E
                    </h2>

                    <p id="carouselDescripcion">
                        Chocolinas, dulce de leche y crema +
                        Deco de corazones rosados y blancos hechos
                        con chocolate blanco
                    </p>

                </div>

            </div>

            <button class="carousel-button carousel-next" id="nextTorta">
                ›
            </button>

        </section>

    <div class="carousel-indicators" id="carouselIndicators"></div>
        <!-- INDICADORES -->

        <div class="carousel-indicators" id="carouselIndicators">
        </div>


    </main>

    <!-- VISOR DE IMAGEN -->
    <div class="image-modal" id="imageModal">
        <button class="image-modal-close" id="closeImageModal">×</button>
        <img id="modalImagen" src="" alt="">
    </div>

    <script src="static/js/carrusel.js"></script>
    <script src="static/js/footer.js"></script>

</body>

</html>
